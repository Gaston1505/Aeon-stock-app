name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: functions
      - run: npm install -g firebase-tools
      # Requiere el secreto de repo FIREBASE_SERVICE_ACCOUNT (el JSON completo de la cuenta de
      # servicio de Firebase) y que el proyecto esté en el plan Blaze — las funciones programadas
      # (Cloud Scheduler) no están disponibles en el plan Spark gratuito. firebase-tools detecta
      # GOOGLE_APPLICATION_CREDENTIALS solo (Application Default Credentials), sin login interactivo.
      - run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: firebase deploy --only functions --project aeon-stock-app --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
